name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: skilltrack_test
          POSTGRES_USER: skilltrack
          POSTGRES_PASSWORD: skilltrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://skilltrack:skilltrack@localhost:5432/skilltrack_test
      JWT_SECRET: ci-secret
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint
        run: cd backend && ruff check app tests
      - name: Type check
        run: cd backend && mypy app
      - name: Tests
        run: cd backend && pytest -q --cov=app --cov-report=xml --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend
        run: cd frontend && npm ci || npm install
      - name: Lint
        run: cd frontend && npm run lint
      - name: Tests
        run: cd frontend && npm test -- --run
      - name: Build
        run: cd frontend && npm run build
