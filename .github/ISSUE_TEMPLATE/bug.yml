name: Anomalie
description: Signaler un comportement reproductible sans donnée sensible.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: context
    attributes:
      label: Contexte et résultat attendu
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes de reproduction
      placeholder: "1. Se connecter\n2. Ouvrir…"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Résultat observé et messages
      description: Ne collez ni jeton, ni secret, ni donnée personnelle.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit ou version
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critères de validation du correctif
    validations:
      required: true
