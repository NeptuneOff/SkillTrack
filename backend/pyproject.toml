[project]
name = "skilltrack-backend"
version = "1.0.0"
description = "SkillTrack FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "alembic>=1.13",
    "uvicorn[standard]>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-jose[cryptography]>=3.3",
    "bcrypt==5.0.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.1"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx2>=2.12", "ruff>=0.4", "mypy>=1.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
# Alembic revisions are exercised through a subprocess against PostgreSQL;
# keep application coverage focused on code imported by the test process.
omit = ["app/alembic/*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["B008", "BLE001", "DTZ011", "E501", "EXE002", "I001"]

[tool.mypy]
ignore_missing_imports = true
